<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin Ranking UMK3</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Protección de acceso al panel -->
  <script>
    (function () {
      const claveCorrecta = "Vicky321tyler";
      const sesion = sessionStorage.getItem("admin_auth");
      if (sesion !== "true") {
        const password = prompt("Seguridad: Ingrese la clave de administrador para acceder al panel:");
        if (password === claveCorrecta) {
          sessionStorage.setItem("admin_auth", "true");
        } else {
          alert("Acceso denegado.");
          window.location.href = 'index.html';
        }
      }
    })();
  </script>

  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: #fff;
      padding: 10px;
      margin: 0;
    }
    h1, h2 {
      text-align: center;
      margin: 10px 0;
    }
    section {
      background: #1a1a1a;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 12px;
    }
    input, button, select {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      background: #03a9f4;
      color: #000;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      opacity: 0.85;
    }
    select {
      background: #333;
      color: #fff;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th, td {
      padding: 12px 5px;
      border-bottom: 1px solid #333;
      text-align: center;
    }
    th {
      background: #222;
      color: #bbb;
      font-size: 0.75rem;
      text-transform: uppercase;
    }
    .pagination {
      text-align: center;
      margin: 20px 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }
    .pagination button {
      min-width: 36px;
      height: 36px;
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid #FFD700;
      background: #111;
      color: #FFD700;
      font-weight: bold;
      cursor: pointer;
    }
    .pagination button.active {
      background: #FFD700;
      color: #111;
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .hidden { display: none; }
    .modal-content {
      background: #222;
      padding: 20px;
      border-radius: 12px;
      width: 80%;
      max-width: 300px;
    }
  </style>
</head>
<body>
  <h1>👑 ADMIN PANEL - UMK3</h1>

  <section>
    <h2 style="font-size: 1.1rem;">➕ Agregar jugador</h2>
    <input id="playerName" placeholder="Nombre del jugador">
    <input id="playerPass" type="password" placeholder="Contraseña (mín. 6 dígitos)">
    <select id="playerCountry">
      <option value="">Seleccionar País (Opcional)</option>
      <option value="ARGENTINA">Argentina 🇦🇷</option>
      <option value="PERÚ">Perú 🇵🇪</option>
      <option value="PARAGUAY">Paraguay 🇵🇾</option>
      <option value="CHILE">Chile 🇨🇱</option>
      <option value="URUGUAY">Uruguay 🇺🇾</option>
      <option value="BRASIL">Brasil 🇧🇷</option>
      <option value="ECUADOR">Ecuador 🇪🇨</option>
    </select>
    <button onclick="addPlayer()">Agregar Guerrero</button>
  </section>

  <section>
    <button onclick="forceRebuild()" style="background:#4CAF50; color:white; width:100%; padding:12px; margin:10px 0;">
      🔄 Sincronizar y Recalcular Ranking
    </button>
    <button onclick="resetInactivePlayers()" style="background:#d32f2f; color:white; width:100%; padding:12px;">
      🔄 Reiniciar a 0 ELO jugadores sin peleas
    </button>
  </section>

  <section>
    <h2 style="font-size: 1.1rem;">⚔️ Registrar pelea</h2>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
      <input id="p1Input" list="playerList" placeholder="Jugador 1">
      <input id="s1Input" type="number" placeholder="Puntos 1">
      <input id="p2Input" list="playerList" placeholder="Jugador 2">
      <input id="s2Input" type="number" placeholder="Puntos 2">
    </div>
    <button onclick="registerMatch()">Guardar resultado</button>
    <div id="confirm"></div>
    <datalist id="playerList"></datalist>
  </section>

  <script>
    // ==================== CONFIGURACIÓN FIREBASE UMK3 ====================
    const firebaseConfig = {
        apiKey: "AIzaSyDX3nh00bFrYip5eynuMQJ1jSnk0c_1Ay0",
        authDomain: "umk-3-liga.firebaseapp.com",
        databaseURL: "https://umk-3-liga-default-rtdb.firebaseio.com",
        projectId: "umk-3-liga",
        storageBucket: "umk-3-liga.firebasestorage.app",
        messagingSenderId: "719592250850",
        appId: "1:719592250850:web:b7fd68412b9fa07931adbb"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Variables globales
    let players = [];
    let history = [];
    const PAGE_SIZE = 10;

    // ==================== FUNCIONES ====================

    function addPlayer() {
      const name = document.getElementById("playerName").value.trim();
      const pass = document.getElementById("playerPass").value.trim();
      const country = document.getElementById("playerCountry").value;

      if (!name) return alert("Ingrese un nombre");
      if (pass.length < 6) return alert("La contraseña debe tener al menos 6 dígitos");
      if (players.some(p => p.name.toLowerCase() === name.toLowerCase())) 
        return alert("El jugador ya existe");

      players.push({
        name: name,
        password: pass,
        elo: 0,
        wins: 0,
        losses: 0,
        streak: 0,
        country: country || null
      });

      document.getElementById("playerName").value = "";
      document.getElementById("playerPass").value = "";
      document.getElementById("playerCountry").value = "";

      saveCloud();
      alert("Guerrero agregado con éxito");
    }

    function saveCloud() {
      db.ref('players').set(players || []);
      db.ref('history').set(history || []);
    }

    function forceRebuild() {
      if (!confirm("¿Recalcular todo el ranking basado en el historial?")) return;
      rebuild();
      saveCloud();
      alert("Ranking sincronizado correctamente.");
    }

    function resetInactivePlayers() {
      if (!confirm("¿Poner en 0 ELO a todos los jugadores sin peleas?")) return;

      let count = 0;
      players.forEach(p => {
        const hasMatches = history.some(h => h.p1 === p.name || h.p2 === p.name);
        if (!hasMatches) {
          p.elo = 0;
          p.wins = 0;
          p.losses = 0;
          p.streak = 0;
          count++;
        }
      });

      saveCloud();
      alert(`Se reiniciaron ${count} jugadores sin peleas.`);
    }

    function rebuild() {
      players.forEach(p => {
        p.elo = 0;
        p.wins = 0;
        p.losses = 0;
        p.streak = 0;
      });

      [...history].reverse().forEach(h => {
        const A = players.find(p => p.name === h.p1);
        const B = players.find(p => p.name === h.p2);
        if (A && B) {
          const sa = parseInt(h.s1), sb = parseInt(h.s2);
          const diff = Math.abs(sa - sb);

          const winner = sa > sb ? A : B;
          const loser = sa > sb ? B : A;

          winner.wins++;
          loser.losses++;

          const pointsWin = 20 + (diff * 2);
          const pointsLoss = 15 + (diff * 2);

          winner.elo += pointsWin;
          loser.elo = Math.max(0, loser.elo - pointsLoss);
        }
      });
    }

    function registerMatch() {
      const p1 = document.getElementById("p1Input").value.trim();
      const p2 = document.getElementById("p2Input").value.trim();
      const s1 = parseInt(document.getElementById("s1Input").value);
      const s2 = parseInt(document.getElementById("s2Input").value);

      if (!p1 || !p2 || isNaN(s1) || isNaN(s2)) return alert("Datos incompletos");

      history.unshift({ id: Date.now().toString(), p1: p1, p2: p2, s1: s1, s2: s2 });

      rebuild();
      saveCloud();
      alert("Resultado guardado");
      
      document.getElementById("p1Input").value = "";
      document.getElementById("s1Input").value = "";
      document.getElementById("p2Input").value = "";
      document.getElementById("s2Input").value = "";
    }

    // Inicializar datos
    db.ref('/').on('value', snapshot => {
      const data = snapshot.val();
      players = data?.players || [];
      history = data?.history || [];
      console.log("Datos cargados - Jugadores:", players.length, "Peleas:", history.length);
    });
  </script>
</body>
</html>
