<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Admin Ranking DBZ BT3</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script>
    // --- PROTECCIÓN DE ACCESO AL PANEL ---
    (function () {
      const claveCorrecta = "Vicky321tyler";
      const sesion = sessionStorage.getItem("admin_auth");

      if (sesion !== "true") {
        const password = prompt("Seguridad: Ingrese la clave de administrador para acceder al panel:");
        if (password === claveCorrecta) {
          sessionStorage.setItem("admin_auth", "true");
        } else {

          window.location.href = 'index.html';

  </script>

  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: #fff;
      padding: 10px;
      margin: 0;
    }

    h1,
    h2 {
      text-align: center;
      margin: 10px 0;
    }

    section {
      background: #1a1a1a;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 12px;
    }

    input,
    button,
    select {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      box-sizing: border-box;
    }

    button {
      background: #03a9f4;
      color: #000;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.85;
    }

    select {
      background: #333;
      color: #fff;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th,
    td {
      padding: 12px 5px;
      border-bottom: 1px solid #333;
      text-align: center;
    }

    th {
      background: #222;
      color: #bbb;
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    .rank-col {
      color: #FFD700;
      font-weight: bold;
      width: 30px;
    }

    .player-name-col {
      text-align: left;
      padding-left: 10px;
      font-weight: bold;
    }

    .rank-S {
      color: #FFD700;
      font-weight: bold;
    }

    .rank-A {
      color: #FF5252;
      font-weight: bold;
    }

    .rank-B {
      color: #4CAF50;
      font-weight: bold;
    }

    .rank-C {
      color: #03A9F4;
      font-weight: bold;
    }

    .rank-D {
      color: #BDBDBD;
      font-weight: bold;
    }

    .rank-E {
      color: #9E9E9E;
      font-weight: bold;
    }

    .player-flag {
      width: 22px;
      height: 15px;
      object-fit: cover;
      display: block;
      margin: auto;
      border-radius: 2px;
    }

    .del-btn,
    .edit-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      opacity: 0.5;
      width: auto;
      display: inline-block;
    }

    .del-btn:hover,
    .edit-btn:hover {
      opacity: 1;
    }

    .log-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log {
      background: #111;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
    }

    .log-num {
      color: #FFD700;
      font-weight: bold;
      width: 35px;
    }

    .log-content {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
    }

    .log-score {
      width: 60px;
      text-align: center;
      color: #aaa;
      font-weight: bold;
    }

    .win {
      color: #4CAF50;
      font-weight: bold;
    }

    .loss {
      color: #F44336;
      font-weight: bold;
    }

    /* Paginación limpia y responsiva */
    .pagination {
      text-align: center;
      margin: 20px 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      padding: 0 10px;
      box-sizing: border-box;
    }

    .pagination button {
      min-width: 36px;
      height: 36px;
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid #FFD700;
      background: #111;
      color: #FFD700;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pagination button.active {
      background: #FFD700;
      color: #111;
    }

    .pagination button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: #222;
    }

    .pagination span {
      padding: 0 8px;
      color: #FFD700;
      font-size: 1.1rem;
      align-self: center;
    }

    @media (max-width: 600px) {
      .pagination {
        gap: 6px;
        padding: 0 5px;
      }

      .pagination button {
        min-width: 32px;
        height: 32px;
        padding: 0 8px;
        font-size: 0.9rem;
      }

      .pagination span {
        padding: 0 6px;
        font-size: 1rem;
      }
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .hidden {
      display: none;
    }

    .modal-content {
      background: #222;
      padding: 20px;
      border-radius: 12px;
      width: 80%;
      max-width: 300px;
    }
  </style>

<body>

  <h1>👑 ADMIN PANEL</h1>

  <section>
    <h2 style="font-size: 1.1rem;">➕ Agregar jugador</h2>
    <input id="playerName" placeholder="Nombre del jugador">
    <input id="playerPass" type="password" placeholder="Contraseña (mín. 6 dígitos)">
    <select id="playerCountry">
      <option value="">Seleccionar País (Opcional)</option>
      <option value="ARGENTINA">Argentina 🇦🇷</option>
      <option value="PERÚ">Perú 🇵🇪</option>
      <option value="PARAGUAY">Paraguay 🇵🇾</option>
      <option value="CHILE">Chile 🇨🇱</option>
      <option value="URUGUAY">Uruguay 🇺🇾</option>
      <option value="BRASIL">Brasil 🇧🇷</option>
      <option value="ECUADOR">Ecuador 🇪🇨</option>
    </select>
    <button onclick="addPlayer()">Agregar Guerrero</button>
    <button onclick="forceRebuild()" style="background:#4CAF50; color:white; margin-top:10px;">🔄 Sincronizar y Recalcular Ranking</button>
    <button onclick="resetInactivePlayers()" style="background:#d32f2f; color:white; margin-top:10px; padding:12px 20px; border-radius:8px; font-weight:bold; width:100%;">🔄 Reiniciar a 0 ELO jugadores sin peleas</button>
  </section>

  <section>
    <h2 style="font-size: 1.1rem;">⚔️ Registrar pelea</h2>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
      <input id="p1Input" list="playerList" placeholder="Jugador 1">
      <input id="s1Input" type="number" placeholder="Puntos 1">
      <input id="p2Input" list="playerList" placeholder="Jugador 2">
      <input id="s2Input" type="number" placeholder="Puntos 2">
    </div>
    <button onclick="registerMatch()">Guardar resultado</button>
    <div id="confirm"></div>
    <datalist id="playerList"></datalist>
  </section>

  <section>
    <h2 style="font-size: 1.1rem;">📊 Ranking (preview)</h2>
    <table>
      <thead>
        <tr>
          <th>Pos</th>
          <th>🌐</th>
          <th style="text-align:left; padding-left:10px;">Jugador</th>
          <th>Rango</th>
          <th>ELO</th>
          <th>W/L</th>
          <th>Racha</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="rankingPreview"></tbody>
    </table>
    <div id="rankingPagination" class="pagination"></div>
  </section>

  <section>
    <h2 style="font-size: 1.1rem;">📝 Últimos resultados</h2>
    <div id="logs" class="log-container"></div>
    <div id="logsPagination" class="pagination"></div>
  </section>

  <div id="editModal" class="modal hidden">
    <div class="modal-content">
      <h3 style="text-align:center;">✏️ Editar resultado</h3>
      <input id="editS1" type="number" placeholder="Puntos 1">
      <input id="editS2" type="number" placeholder="Puntos 2">
      <button onclick="saveEdit()">Guardar cambios</button>
      <button onclick="closeEdit()" style="background:#444; color: white;">Cancelar</button>
    </div>
  </div>

    <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD_eT9VlLk_b1toTcva8w9NwU-FGjrEtEI",
      authDomain: "ranking-dbz-bt3.firebaseapp.com",
      databaseURL: "https://ranking-dbz-bt3-default-rtdb.firebaseio.com",
      projectId: "ranking-dbz-bt3",
      storageBucket: "ranking-dbz-bt3.firebasestorage.app",
      messagingSenderId: "228731370543",
      appId: "1:228731370543:web:ff3e418be283b6387edada"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ==================== VARIABLES GLOBALES ====================
    let players = [];
    let history = [];
    let editingId = null;
    const PAGE_SIZE = 10;
    let currentPageLogs = 1;
    let currentPageRanking = 1;
    let isSaving = false;

    const ranks = [
      { name: "E", min: 0, max: 499, class: "rank-E" },
      { name: "D", min: 500, max: 799, class: "rank-D" },
      { name: "C", min: 800, max: 1099, class: "rank-C" },
      { name: "B", min: 1100, max: 1399, class: "rank-B" },
      { name: "A", min: 1400, max: 1799, class: "rank-A" },
      { name: "S", min: 1800, max: Infinity, class: "rank-S" }
    ];

    const countryByName = {
      "DARK": "ARGENTINA", "ETR-FASTEK": "ARGENTINA", "ETR-MICKY": "ARGENTINA",
      "MILANCO": "ARGENTINA", "KEVON": "ARGENTINA", "MORATO": "ARGENTINA",
      "ETR-JYX": "ARGENTINA", "ANDY-PEREZ": "ARGENTINA", "CHINCHANO": "PERÚ",
      "EMANUEL09": "PERÚ", "ETR-NOVAK": "ARGENTINA", "JNC": "PARAGUAY",
      "BRIAN-TNK": "ARGENTINA", "MAX-FARO": "ARGENTINA", "ALEXANDER": "ARGENTINA"
    };

    function getRank(elo) {
      return ranks.find(r => elo >= r.min && elo <= r.max) || ranks[0];
    }

    function getBanderaHTML(country) {
      if (!country) return "";
      const banderas = {
        "ARGENTINA": "bandera argentina.png",
        "PERÚ": "bandera peru.png",
        "PARAGUAY": "bandera paraguay.png",
        "CHILE": "bandera chile.png",
        "URUGUAY": "bandera uruguay.png",
        "ECUADOR": "bandera ecuador.png",
        "VENEZUELA": "bandera venezuela.png"
      };
      const file = banderas[country.toUpperCase()];
      return file ? `<img src="Imagenes/${file}" class="player-flag">` : "";
    }

    // ==================== FUNCIONES ====================
    function saveCloud() {
      console.log("Intentando guardar cambios...");
      isSaving = true;
      db.ref('players').set(players || []).catch(err => console.error("Error players:", err));
      db.ref('history').set(history || []).catch(err => console.error("Error history:", err));
    }

    function addPlayer() {
      const name = document.getElementById("playerName").value.trim();
      const pass = document.getElementById("playerPass").value.trim();
      const country = document.getElementById("playerCountry").value;

      if (!name) return alert("Ingrese un nombre");
      if (pass.length < 6) return alert("La contraseña debe tener al menos 6 dígitos");
      if (players.some(p => p.name.toLowerCase() === name.toLowerCase())) return alert("El jugador ya existe");

      players.push({
        name: name,
        password: pass,
        elo: 0,
        wins: 0,
        losses: 0,
        streak: 0,
        country: country || null
      });

      saveCloud();
      alert("Guerrero agregado con éxito");
      document.getElementById("playerName").value = "";
      document.getElementById("playerPass").value = "";
      document.getElementById("playerCountry").value = "";
    }

    function forceRebuild() {
      if (!confirm("¿Deseas recalcular todas las estadísticas basándote en el historial?")) return;
      rebuild();
      saveCloud();
      alert("Ranking sincronizado correctamente.");
    }

    function resetInactivePlayers() {
      if (!confirm("¿Estás seguro de poner en 0 ELO a todos los jugadores que NO tienen ninguna pelea jugada?")) return;
      let count = 0;
      players.forEach(p => {
        const hasMatches = history.some(h => h.p1 === p.name || h.p2 === p.name);
        if (!hasMatches) {
          p.elo = 0;
          p.wins = 0;
          p.losses = 0;
          p.streak = 0;
          count++;
        }
      });
      saveCloud();
      alert(`Se reiniciaron ${count} jugadores que no tenían peleas a 0 ELO.`);
      renderAll();
    }

    function rebuild() {
      players.forEach(p => {
        p.elo = 0; p.wins = 0; p.losses = 0; p.streak = 0;
      });

      [...history].reverse().forEach(h => {
        const A = players.find(p => p.name === h.p1);
        const B = players.find(p => p.name === h.p2);
        if (A && B) {
          const sa = parseInt(h.s1), sb = parseInt(h.s2);
          const winner = sa > sb ? A : B;
          const loser = sa > sb ? B : A;
          winner.wins++; loser.losses++;
          const diff = Math.abs(sa - sb);
          const K = 32;
          const expected = 1 / (1 + Math.pow(10, (loser.elo - winner.elo) / 400));
          winner.elo += Math.round(K * (1 - expected) + diff * 2);
          loser.elo = Math.max(0, Math.round(loser.elo - (K * expected + diff * 2)));
        }
      });

      players.forEach(p => {
        let currentStreak = 0;
        for (const h of history) {
          if (h.p1 !== p.name && h.p2 !== p.name) continue;
          const won = (h.p1 === p.name && h.s1 > h.s2) || (h.p2 === p.name && h.s2 > h.s1);
          if (currentStreak === 0) currentStreak = won ? 1 : -1;
          else if ((currentStreak > 0 && won) || (currentStreak < 0 && !won)) currentStreak += won ? 1 : -1;
          else break;
        }
        p.streak = currentStreak;
      });
    }

    function registerMatch() {
      const a = document.getElementById("p1Input").value.trim();
      const b = document.getElementById("p2Input").value.trim();
      const sa = parseInt(document.getElementById("s1Input").value);
      const sb = parseInt(document.getElementById("s2Input").value);

      if (!a || !b || a === b || isNaN(sa) || isNaN(sb)) return alert("Datos incompletos");

      history.unshift({ id: Date.now().toString(), p1: a, p2: b, s1: sa, s2: sb });
      rebuild();
      saveCloud();

      document.getElementById("p1Input").value = "";
      document.getElementById("p2Input").value = "";
      document.getElementById("s1Input").value = "";
      document.getElementById("s2Input").value = "";

      const confirmDiv = document.getElementById("confirm");
      confirmDiv.innerHTML = `<div style="background:#2e7d32;padding:6px;border-radius:6px;text-align:center;margin-top:5px;">✅ Guardado</div>`;
      setTimeout(() => confirmDiv.innerHTML = "", 1500);
    }

    function renderAll() {
      document.getElementById("playerList").innerHTML = players.map(p => `<option value="${p.name}">`).join("");
      renderRanking();
      renderLogs();
    }

    // === Agrega aquí las funciones renderRanking, renderLogs, renderPagination, openEdit, saveEdit, closeEdit si no las tienes ===

    // Inicializar listener
    db.ref('/').on('value', snapshot => {
      if (isSaving) {
        isSaving = false;
        return;
      }
      const data = snapshot.val() || {};
      players = data.players || [];
      history = data.history || [];
      if (history.length) history.sort((a, b) => parseInt(b.id) - parseInt(a.id));
      renderAll();
    });
  </script>
</body>
</html>
